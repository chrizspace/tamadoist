<title>Tamadoist Design System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

:root {
  --color-primary: #1fbf8f;
  --color-primary-dark: #159a72;
  --color-primary-soft: #ddf7ee;
  --color-accent: #ffc93c;
  --color-accent-dark: #e0a800;
  --color-water: #4cc3ff;
  --color-water-dark: #2a9bd8;
  --color-water-soft: #dff4ff;
  --color-night: #4b4fa8;
  --color-night-soft: #e6e7fa;
  --color-danger: #ff5a5f;
  --color-bg: #ffffff;
  --color-surface: #f4f7f6;
  --color-border: #e2e8e6;
  --color-text: #1f2d2a;
  --color-text-muted: #6b7c77;
  --color-on-primary: #ffffff;
  --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px;
  --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px; --radius-full: 999px;
  --font: Nunito, system-ui, sans-serif;
}

body { font-family: var(--font); color: var(--color-text); background: var(--color-bg); margin: 0; font-weight: 600; }

.td-btn {
  font: 800 16px/1 var(--font); border: 0; border-radius: var(--radius-md); padding: 18px 24px; width: 100%;
  cursor: pointer; color: var(--btn-fg); background: var(--btn-bg); box-shadow: 0 4px 0 var(--btn-shadow);
  transition: transform 0.05s, box-shadow 0.05s;
}
.td-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--btn-shadow); }
.td-btn:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-btn:disabled { cursor: not-allowed; }
.td-btn--primary { --btn-bg: var(--color-primary); --btn-fg: var(--color-on-primary); --btn-shadow: var(--color-primary-dark); }
.td-btn--water { --btn-bg: var(--color-water); --btn-fg: var(--color-on-primary); --btn-shadow: var(--color-water-dark); }
.td-btn--secondary { --btn-bg: var(--color-bg); --btn-fg: var(--color-primary-dark); --btn-shadow: var(--color-border); border: 2px solid var(--color-border); }
.td-btn--disabled, .td-btn:disabled { --btn-bg: var(--color-border); --btn-fg: var(--color-text-muted); --btn-shadow: var(--color-border); }

.td-field { display: flex; flex-direction: column; gap: var(--space-8); width: 100%; }
.td-field__label { font: 700 13px var(--font); color: var(--color-text-muted); }
.td-field__input {
  font: 600 16px var(--font); color: var(--color-text); padding: 14px 16px; border-radius: var(--radius-md);
  background: var(--color-surface); border: 2px solid var(--color-border); outline: none; width: 100%; box-sizing: border-box;
}
.td-field__input:focus { border-color: var(--color-primary); background: var(--color-bg); }
.td-field--error .td-field__input { border-color: var(--color-danger); }
.td-field__error { font: 700 13px var(--font); color: var(--color-danger); }

.td-card { background: var(--color-bg); border: 2px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-16); display: flex; flex-direction: column; gap: var(--space-8); }
.td-card__title { font: 700 18px var(--font); margin: 0; }
.td-card__body { font: 600 16px var(--font); color: var(--color-text-muted); margin: 0; }

.td-energy { width: 100%; display: flex; flex-direction: column; gap: var(--space-8); }
.td-energy__row { display: flex; gap: var(--space-8); font: 700 18px var(--font); }
.td-energy__value { color: var(--color-primary-dark); }
.td-energy__track { height: 20px; border-radius: 10px; background: var(--color-surface); border: 2px solid var(--color-border); overflow: hidden; }
.td-energy__fill { height: 100%; border-radius: 8px; background: var(--color-primary); transition: width 0.4s; }
.td-energy__fill--low { background: var(--color-accent); }

.td-dots { display: flex; gap: var(--space-8); justify-content: center; }
.td-dots__dot { height: 10px; width: 10px; border-radius: 5px; background: var(--color-border); }
.td-dots__dot--done { background: var(--color-primary); }
.td-dots__dot--active { background: var(--color-primary); width: 28px; }

.td-pet { display: block; }
@keyframes td-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
.td-pet--awake .td-pet__body { transform-origin: 100px 190px; animation: td-breathe 3s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .td-pet--awake .td-pet__body { animation: none; } }

/* ===== Game UI (scene, header, battery, menu, actions) ===== */
:root {
  --color-sky: #e6faf6; --color-sky-night: #c9ccf2; --color-hill: #10b38a; --color-hill-night: #0e8c72;
  --color-hill-far: #8ec5ff; --color-hill-far-night: #7c84d6; --color-tree: #0b8f6f; --color-tree-trunk: #2d6fa3;
}
.td-phone { width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 44px; background: var(--color-sky); font-family: var(--font); color: var(--color-text); isolation: isolate; box-shadow: 0 0 0 8px #101917, 0 18px 40px rgba(0,0,0,.28); }
.td-phone *, .td-phone *::before, .td-phone *::after { box-sizing: border-box; }
.td-scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
.td-layer { position: absolute; inset: 0; z-index: 1; }
.td-hero { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 2; }
.td-float svg { animation: td-bob 3.4s ease-in-out infinite; }
@keyframes td-bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .td-float svg { animation: none; } }

.td-header { position: absolute; left: 0; right: 0; top: 48px; height: 64px; display: flex; align-items: center; padding: 0 16px; gap: 8px; z-index: 3; }
.td-header__left { display: flex; gap: 8px; min-width: 48px; }
.td-header__title { flex: 1; min-width: 0; text-align: center; font: 800 16px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.td-header__right { margin-left: auto; }
.td-iconbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--color-primary); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 var(--lip) 0 var(--color-primary-dark); }
.td-iconbtn svg, .td-circle svg, .td-action__box svg, .td-menurow__badge svg { width: 24px; height: 24px; }
.td-iconbtn:focus-visible, .td-action:focus-visible, .td-circle:focus-visible, .td-menurow:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }


.td-nametag { display: inline-block; background: #fff; border: 2px solid var(--color-border); border-radius: 999px; padding: 6px 20px; font: 800 24px var(--font); }
.td-sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 32px 32px 0 0; padding: 26px 24px 34px; display: flex; flex-direction: column; gap: 14px; z-index: 3; box-shadow: 0 -4px 16px rgba(0,0,0,.12); }
.td-sheet h3 { margin: 0; font: 800 24px var(--font); text-align: center; }
.td-sheet p { margin: 0; text-align: center; color: var(--color-text-muted); font: 600 16px/1.4 var(--font); }
.td-caption { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 342px; text-align: center; font: 800 16px var(--font); color: #fff; background: rgba(15,40,34,.62); padding: 6px 16px; border-radius: 999px; z-index: 2; }
.td-timecard { background: var(--color-night-soft); border-radius: 24px; padding: 16px; text-align: center; }
.td-timecard b { display: block; font: 800 32px var(--font); color: var(--color-night); }
.td-timecard span { font: 700 16px var(--font); color: var(--color-text-muted); }

.td-actionbar { position: absolute; left: 0; right: 0; bottom: 28px; display: flex; justify-content: safe center; gap: 24px; padding: 0 24px 6px; overflow-x: auto; scrollbar-width: none; z-index: 3; }
.td-actionbar::-webkit-scrollbar { display: none; }
.td-actionbar > * { flex: none; }
.td-actionbar--pair { gap: 70px; }
.td-action { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; cursor: pointer; font: 700 13px var(--font); color: #fff; }
.td-action__box { width: 76px; height: 76px; border-radius: 28px; background: #fff; color: var(--color-water-dark); display: grid; place-items: center; box-shadow: 0 var(--lip) 0 var(--lip-neutral); transition: transform .05s, box-shadow .05s; }
.td-action__box svg { width: 36px; height: 36px; }
.td-action--active .td-action__box { background: var(--color-primary); color: #fff; border-radius: 38px; box-shadow: 0 var(--lip) 0 var(--color-primary-dark); }
.td-action:disabled { opacity: .5; cursor: not-allowed; }
.td-roundbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 13px var(--font); color: #fff; }
.td-circle { width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; padding: 0; }
.td-circle svg { width: 36px; height: 36px; }
.td-circle--plus { background: var(--color-water); box-shadow: 0 var(--lip) 0 var(--color-water-dark); color: #fff; }
.td-circle--minus { background: #fff; border: 2px solid var(--color-border); color: var(--color-water-dark); box-shadow: 0 var(--lip) 0 var(--lip-neutral); }

.td-menu { position: absolute; left: 16px; top: 120px; width: 280px; background: #fff; border-radius: 28px; padding: 20px 16px 12px; box-shadow: 0 10px 28px rgba(0,0,0,.25); z-index: 4; display: flex; flex-direction: column; gap: 4px; }
.td-menu__head { font: 700 12px monospace; letter-spacing: .1em; color: var(--color-text-muted); padding: 0 8px 6px; }
.td-menu hr { border: 0; border-top: 2px solid var(--color-border); margin: 4px 8px; }
.td-menurow { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 18px; border: 0; background: none; cursor: pointer; font: 700 16px var(--font); color: var(--color-text); text-align: left; width: 100%; }
.td-menurow:hover { background: var(--color-surface); }
.td-menurow__badge { width: 36px; height: 36px; border-radius: 12px; background: var(--color-primary-soft); color: var(--color-primary-dark); display: grid; place-items: center; flex: none; }
.td-menurow__badge svg { width: 20px; height: 20px; }
.td-menurow--danger { color: var(--color-danger); }
.td-menurow--danger .td-menurow__badge { background: var(--color-surface); color: var(--color-danger); }
.td-menurow__chev { margin-left: auto; width: 18px; height: 18px; color: var(--color-text-muted); }
.td-scrim { position: absolute; inset: 0; background: rgba(0,26,20,.42); z-index: 3; }
.td-dialog { position: absolute; left: 35px; right: 35px; top: 250px; background: #fff; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; z-index: 5; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.td-dialog h3 { margin: 0; font: 800 24px var(--font); }
.td-dialog p { margin: 0; color: var(--color-text-muted); font: 600 16px/1.4 var(--font); }
.td-dialog__btns { display: flex; gap: 12px; }
.td-toast { position: absolute; left: 16px; right: 16px; top: 120px; background: rgba(15,40,34,.62); color: #fff; padding: 14px 20px; border-radius: 20px; font: 800 17px var(--font); display: flex; justify-content: center; align-items: center; z-index: 6; text-align: center; }
.td-toast--inline { position: static; }
.td-toast svg { width: 20px; height: 20px; }
/* water level block */
.td-counter { position: absolute; top: 120px; left: 16px; right: 16px; background: #fff; border-radius: 20px; padding: 8px 20px 12px; text-align: center; z-index: 2; border: 2px solid var(--color-border); display: flex; flex-direction: column; gap: 6px; }
.td-counter b { display: block; font: 800 20px var(--font); color: var(--color-water-dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
.td-counter__track { height: 10px; border-radius: 5px; background: var(--color-water-soft); overflow: hidden; }
.td-counter__fill { height: 100%; border-radius: 5px; background: linear-gradient(var(--color-water), var(--color-water-dark)); transition: width .3s; min-width: 0; }
.td-panelw { position: absolute; left: 45px; right: 45px; background: #fff; border-radius: 20px; padding: 10px 16px; z-index: 2; }
.td-ring { position: absolute; border: 4px dashed var(--color-accent); border-radius: 22px; z-index: 4; pointer-events: none; }
.td-ghost { opacity: .35; }
.td-title-lg { position: absolute; left: 24px; right: 24px; text-align: center; font: 800 40px/1.1 var(--font); color: var(--color-primary-dark); z-index: 2; }
.td-sub { position: absolute; left: 44px; right: 44px; text-align: center; font: 600 16px/1.4 var(--font); color: var(--color-text-muted); z-index: 2; }

/* ===== Scenes, places, schedule ===== */
.td-header__title--btn { background: none; border: 0; cursor: pointer; color: var(--color-text); display: flex; align-items: center; justify-content: center; gap: 2px; padding: 6px 0; border-radius: 12px; }
.td-header__title--btn svg { width: 16px; height: 16px; flex: none; }
.td-header__title--btn:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--color-primary-soft); color: var(--color-primary-dark); font: 800 13px var(--font); }
.td-pill--water { background: var(--color-water-soft); color: var(--color-water-dark); }
.td-pill--night { background: var(--color-night-soft); color: var(--color-night); }
.td-pill--sun { background: #FFF3CC; color: #8A6500; }
.td-pill svg { width: 14px; height: 14px; }
.td-listcard { background: #fff; border: 2px solid var(--color-border); border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.td-listcard__icon { width: 44px; height: 44px; border-radius: 14px; background: var(--color-primary-soft); color: var(--color-primary-dark); display: grid; place-items: center; flex: none; }
.td-listcard__icon svg { width: 24px; height: 24px; }
.td-listcard__body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.td-listcard__body b { font: 800 17px var(--font); }
.td-listcard__body span.sub { font: 600 13px var(--font); color: var(--color-text-muted); }
.td-listcard--add { border-style: dashed; justify-content: center; color: var(--color-primary-dark); font: 800 16px var(--font); background: rgba(255,255,255,.7); cursor: pointer; }
.td-page { position: absolute; left: 16px; right: 16px; top: 128px; bottom: 32px; display: flex; flex-direction: column; gap: 12px; z-index: 2; overflow: hidden; }
.td-page h2 { margin: 0; font: 800 14px var(--font); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .08em; }
.td-scenegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.td-scenecard { border: 2px solid var(--color-border); border-bottom-width: 5px; border-radius: 22px; background: #fff; padding: 0; overflow: hidden; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.td-scenecard[aria-pressed="true"] { border-color: var(--color-primary); }
.td-scenecard__thumb { position: relative; height: 120px; overflow: hidden; background: var(--color-sky); }
.td-scenecard__thumb > div { position: absolute; left: 50%; top: -170px; width: 390px; height: 844px; transform: translateX(-50%) scale(.46); transform-origin: top center; }
.td-scenecard__label { padding: 8px 12px; font: 800 15px var(--font); display: flex; justify-content: space-between; align-items: center; }
.td-scenecard:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-switch { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-surface); border-radius: 20px; font: 700 15px var(--font); }
.td-switch__track { margin-left: auto; width: 52px; height: 32px; border-radius: 16px; background: var(--color-border); position: relative; flex: none; }
.td-switch__track::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; }
.td-switch[aria-checked="true"] .td-switch__track { background: var(--color-primary); }
.td-switch[aria-checked="true"] .td-switch__track::after { transform: translateX(20px); }
.td-note { font: 600 13px/1.4 var(--font); color: var(--color-text-muted); margin: 0; }
.td-mapart { height: 150px; border-radius: 24px; background: #DDEFE8; position: relative; overflow: hidden; }
.td-mapart svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.td-listcard--add svg { width: 22px; height: 22px; }
.td-listcard--add { gap: 8px; }
.td-scenecard__label svg { width: 20px; height: 20px; color: var(--color-primary); padding: 0; background: none; }
.td-page .td-note { background: rgba(255,255,255,.88); padding: 10px 14px; border-radius: 16px; }

.td-editbadge { width: 40px; height: 40px; border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary-dark); display: grid; place-items: center; flex: none; }
.td-editbadge svg { width: 20px; height: 20px; }
button.td-listcard { cursor: pointer; font-family: var(--font); color: var(--color-text); }
button.td-listcard:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }

/* compact scene cards for the 9-location picker */
.td-scenecard--compact .td-scenecard__thumb { height: 84px; }
.td-scenecard--compact .td-scenecard__thumb > div { top: -130px; transform: translateX(-50%) scale(.32); }
.td-scenecard--compact .td-scenecard__label { padding: 6px 8px; font-size: 12px; }
.td-scenegrid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.td-grouphead { margin: 4px 0 -2px; font: 800 12px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
.td-periodbadge { position: absolute; left: 50%; transform: translateX(-50%); top: 116px; z-index: 2; }

/* ===== Elevation system: when to go 3D and when to stay flat =====
 * 3D (a solid darker lip of --lip at the bottom, moves down on press): anything you can press.
 *   Button, IconButton, RoundButton, ActionButton, EnergyChip (when tappable), SceneCard, tappable ListCard / SettingRow.
 * Flat (2px border, no lip): information and fields. NameTag, WaterCounter, Toast, Pill, progress bars, inputs, switches.
 * Surface (soft ambient shadow only, no lip): Sheet, Dialog, MenuPanel.
 * Ghost (text only): the quietest action, e.g. "Nie teraz".
 * Disabled: flat gray. Selected: the lip takes the brand color.
 */
:root { --lip: 4px; --lip-neutral: #CBD5D2; }
.td-iconbtn, .td-circle, .td-action__box { transition: transform .05s, box-shadow .05s; }
.td-iconbtn:active, .td-circle:active, .td-action:active:not(:disabled) .td-action__box { transform: translateY(var(--lip)); box-shadow: 0 0 0 transparent; }
.td-scenecard:active, button.td-listcard:active { transform: translateY(3px); border-bottom-width: 2px; }
button.td-listcard { border-bottom-width: 5px; cursor: pointer; }
.td-btn--ghost { --btn-bg: transparent; --btn-fg: var(--color-water-dark); --btn-shadow: transparent; box-shadow: none; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; }
.td-btn--ghost:active:not(:disabled) { transform: none; background: var(--color-water-soft); }
.td-iconbtn:disabled, .td-circle:disabled { box-shadow: none; opacity: .5; }

/* ===== Round indicators (energy, experience, streak) ===== */
.td-indicators { display: flex; gap: 10px; flex: none; align-items: center; }
.td-ichip { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 2px solid #fff; padding: 0; display: grid; place-items: center; box-shadow: 0 var(--lip) 0 #BFC9C7; font: inherit; color: inherit; }
button.td-ichip { cursor: pointer; transition: transform .05s, box-shadow .05s; }
button.td-ichip:active { transform: translateY(var(--lip)); box-shadow: 0 0 0 transparent; }
button.td-ichip:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-ichip svg { display: block; width: 100%; height: 100%; }
.td-ichip__badge { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); min-width: 22px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--color-text); color: #fff; font: 800 10px/14px var(--font); text-align: center; font-variant-numeric: tabular-nums; border: 2px solid #fff; box-sizing: border-box; pointer-events: none; }

/* Info slot: the strip under the header where the current context is shown (caption, counter); toasts sit right below it. */
.td-caption--slot { left: 16px; right: 16px; transform: none; width: auto; max-width: none; top: 120px; padding: 14px 20px; border-radius: 20px; font-size: 17px; }

/* Screen zones: top bar / indicator rail / scene / interaction bar / action dock */
.td-header__right { min-width: 48px; margin-left: 0; flex: none; display: flex; justify-content: flex-end; }
.td-rail { position: absolute; right: 16px; top: 60px; z-index: 3; }
.td-rail .td-indicators { flex-direction: column; gap: 22px; }
.td-static .td-counter { top: 0; left: 0; right: 0; }

/* Rail folding */
.td-rail { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.td-indicators__more { display: flex; flex-direction: column; align-items: center; gap: 22px; overflow: visible; transition: opacity .2s, transform .2s, max-height .25s; max-height: 200px; }
.td-indicators__more.is-collapsed { opacity: 0; transform: translateY(-12px); max-height: 0; pointer-events: none; }
.td-railtoggle { width: 40px; height: 24px; border: 0; border-radius: 12px; background: var(--color-primary); color: #fff; display: grid; place-items: center; padding: 0; cursor: pointer; box-shadow: 0 3px 0 var(--color-primary-dark); transition: transform .05s, box-shadow .05s; }
.td-railtoggle svg { width: 18px; height: 18px; transform: rotate(180deg); transition: transform .2s; }
.td-railtoggle.is-collapsed svg { transform: none; }
.td-railtoggle:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
.td-railtoggle:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-rail .td-indicators { gap: 0; }
.td-indicators__more { padding-top: 22px; }
.td-indicators__more.is-collapsed { padding-top: 0; visibility: hidden; }
.td-rail { gap: 18px; }

/* Horizontal capsule */
.td-ibar { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 17px; background: #fff; border: 2px solid #fff; box-shadow: 0 3px 0 #BFC9C7; }
.td-ibar__seg { display: flex; align-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--color-text); border-radius: 12px; }
span.td-ibar__seg { cursor: default; }
.td-ibar__seg svg { display: block; flex: none; }
.td-ibar__seg b { font: 800 12px/1 var(--font); font-variant-numeric: tabular-nums; }
button.td-ibar__seg:active { transform: translateY(2px); }
button.td-ibar__seg:focus-visible { outline: 3px solid var(--color-water); outline-offset: 2px; }
.td-header__title--btn { justify-content: safe center; } .td-header__label { flex: 0 1 auto; }
.td-header__title--btn { overflow: visible; } .td-header__label { max-width: calc(100% - 18px); }

/* "+250 ml" pops next to the water amount, on a solid water-blue pill (no separate toast) */
.td-counter__gain { position: absolute; right: 16px; top: 8px; background: var(--color-water); color: #fff; border-radius: 999px; padding: 3px 12px; font: 800 14px/1.3 var(--font); animation: td-gain .35s ease-out; box-shadow: 0 2px 0 var(--color-water-dark); }
@keyframes td-gain { from { transform: translateY(8px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .td-counter__gain { animation: none; } }

/* Round dial: one big chip, three dots in a column on its right */
.td-dial { position: relative; display: flex; align-items: center; gap: 4px; }
.td-dial .td-ichip { width: 48px; height: 48px; box-sizing: border-box; }
.td-dial .td-ichip__badge { font-size: 11px; height: 20px; min-width: 26px; bottom: -11px; }
.td-dial__dots { display: flex; flex-direction: column; align-items: center; }
.td-dial__dot { position: relative; width: 20px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.td-dial__dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 1px 0 rgba(0,0,0,.18); transition: transform .15s, background .15s; }
.td-dial__dot.is-active::after { background: var(--dot); transform: scale(1.3); box-shadow: 0 0 0 2px #fff; }
.td-dial__dot:focus-visible { outline: 3px solid var(--color-water); outline-offset: -2px; }

/* Title pill: readable on any scene. Pressable (scene picker) = 3D lip, plain = flat info pill. */
.td-header__title { flex: 0 1 auto; margin: 0 auto; background: #fff; padding: 9px 16px; border-radius: 999px; border: 2px solid #fff; box-sizing: border-box; box-shadow: 0 2px 6px rgba(15,40,34,.12); max-width: 100%; }
.td-header__title--btn { overflow: hidden; box-shadow: 0 3px 0 #BFC9C7; cursor: pointer; transition: transform .05s, box-shadow .05s; }
.td-header__title--btn:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }

/* Character on its stage: scaled around the feet, name tag above */
.td-stage { position: absolute; left: 0; right: 0; display: flex; justify-content: center; transform-origin: 50% 100%; z-index: 2; pointer-events: none; }
.td-stage__group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.td-stage__pet { transform-origin: 50% 100%; display: block; line-height: 0; }
.td-stage__water { display: block; margin-top: -58px; position: relative; z-index: 1; }

/* Status card */
.td-status { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; overflow-y: auto; padding: 4px 4px 40px; scrollbar-width: none; }
.td-status::-webkit-scrollbar { display: none; }
.td-status__head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 12px; flex: none; }
.td-status__head h3 { text-align: left; }
.td-status__close { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--color-border); background: #fff; color: var(--color-text); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 3px 0 var(--lip-neutral); }
.td-status__close svg { width: 22px; height: 22px; }
.td-status__close:active { transform: translateY(3px); box-shadow: none; }
.td-status__sec { border: 2px solid var(--color-border); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.td-status__sec.is-focus { border-color: var(--c); background: color-mix(in srgb, var(--c) 7%, #fff); }
.td-status__sec > header { display: flex; align-items: baseline; justify-content: space-between; }
.td-status__sec h4 { margin: 0; font: 800 17px var(--font); }
.td-status__sec > header > span { font: 800 17px var(--font); color: var(--c); font-variant-numeric: tabular-nums; }
.td-status__bar { height: 12px; border-radius: 6px; background: #E9EFED; overflow: hidden; }
.td-status__bar > div { height: 100%; border-radius: 6px; background: var(--c); }
.td-status__facts, .td-status__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.td-status__facts li { display: flex; align-items: center; gap: 10px; font: 600 15px/1.3 var(--font); color: var(--color-text); }
.td-status__facts svg { width: 20px; height: 20px; flex: none; color: var(--color-text-muted); }
.td-status__facts b { font-weight: 800; }
.td-status__list li { display: flex; align-items: center; gap: 12px; font: 700 15px/1.25 var(--font); }
.td-status__list li.is-done { color: var(--color-text-muted); }
.td-status__list li.is-done > :not(.td-status__check) { text-decoration: line-through; }
.td-status__list small { display: block; font: 600 13px var(--font); color: var(--color-text-muted); text-decoration: none; }
.td-status__check { width: 24px; height: 24px; border-radius: 50%; border: 2.5px solid var(--color-border); flex: none; display: grid; place-items: center; color: #fff; }
.td-status__check.is-done { background: var(--c); border-color: var(--c); }
.td-status__check svg { width: 14px; height: 14px; stroke-width: 3.4; }
.td-status__hint { margin: -4px 0 0 !important; text-align: left !important; font: 600 14px var(--font) !important; }

.td-phone--plain { background: #F6F9F8; }
.td-statusfull { position: absolute; inset: 0; padding: 60px 20px 0; display: flex; flex-direction: column; z-index: 3; }
.td-statusfull .td-status__head h3 { margin: 0; font: 800 28px var(--font); }

.td-circle--primary { background: var(--color-primary); box-shadow: 0 var(--lip) 0 var(--color-primary-dark); color: #fff; }
.td-circle--plain { background: #fff; border: 2px solid var(--color-border); color: var(--color-text); box-shadow: 0 var(--lip) 0 var(--lip-neutral); }
.td-counter__next { font: 700 14px var(--font); color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.td-counter .td-counter__next b { display: inline; font: 800 14px var(--font); color: var(--color-text); }
.td-counter--green b:first-of-type { color: var(--color-primary-dark); }
.td-counter--green .td-counter__fill { background: linear-gradient(var(--color-primary), var(--color-primary-dark)); }
.td-counter--green .td-counter__track { background: var(--color-primary-soft); }
.td-counter--green .td-counter__gain { background: var(--color-primary); box-shadow: 0 2px 0 var(--color-primary-dark); }
.td-status__list button.td-status__check { cursor: pointer; padding: 0; background: #fff; }
.td-status__list button.td-status__check.is-done { background: var(--c); }
.td-status__list li { min-height: 40px; }

/* Concept: a calm specimen book (page chrome) around a bright, rounded game UI (the product, which keeps its own fixed palette from packages/ui/src/styles.css). */
:root{
  --bg:#F5F8F7; --surface:#FFFFFF; --ink:#1F2D2A; --muted:#62736E; --line:#E1E8E5; --accent:#127F5F; --chip:#E7F3EF;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1614;--surface:#16211E;--ink:#E7F1EE;--muted:#93A8A1;--line:#25342F;--accent:#45D8A8;--chip:#1C2D28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1614;--surface:#16211E;--ink:#E7F1EE;--muted:#93A8A1;--line:#25342F;--accent:#45D8A8;--chip:#1C2D28;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;margin:0;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
header.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--line);padding-bottom:20px}
h1{font-size:clamp(28px,5vw,44px);font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:500 13px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
nav.tabs{display:flex;gap:6px;background:var(--chip);padding:5px;border-radius:999px;flex-wrap:wrap}
nav.tabs button{font:800 15px var(--font);border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.08)}
nav.tabs button:focus-visible{outline:3px solid var(--color-water);outline-offset:2px}
main{padding-top:8px}
.sec{padding-top:12px}
h2{font-size:26px;font-weight:800;margin:40px 0 6px;text-wrap:balance}
.sec:first-child h2{margin-top:24px}
h3{margin:0;font-size:17px;font-weight:800}
p.lead{color:var(--muted);margin:0 0 20px;max-width:70ch}
.note{font-size:13px;color:var(--muted);margin:0}
.mono{font-family:var(--mono);font-size:.9em}
.box{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.spec{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{border-radius:16px;padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;background:var(--color-surface);color:var(--color-text);overflow-x:auto}
.stage.sky{background:linear-gradient(var(--color-sky),#cdeee6)}
.stage.hillbg{background:var(--color-hill)}
.stage.col{flex-direction:column;align-items:stretch;flex-wrap:nowrap}
.group{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sw{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.sw:focus-visible{outline:3px solid var(--color-water)}

.tscale>div{display:flex;gap:20px;align-items:baseline;padding:12px 0;border-bottom:2px solid var(--line);flex-wrap:wrap}

.archgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:12px}

.ctl{display:flex;gap:12px;align-items:center;font-size:14px;flex-wrap:wrap;margin:8px 0}

.ctl select,.ctl input[type=number],.fld select,.fld input[type=number]{font:700 14px var(--font);padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}

.readout{display:flex;flex-direction:column;background:var(--color-primary-soft);color:var(--color-text);border-radius:16px;padding:10px 14px}
.readout b{font-size:22px;font-weight:800}.readout span{font-size:13px;color:var(--color-text-muted)}
button.mini{font:800 14px var(--font);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}

.states{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.states div{width:118px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.states b{font-size:13px}.states span{font-size:11px;line-height:1.3;color:var(--color-text-muted)}
.periods{display:flex;flex-wrap:wrap;gap:18px 16px}
.period{display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.period b{margin-top:8px}.period .mono{font-size:12px;color:var(--muted)}
.frame{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.18);flex:none}
.prio{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.resolved{display:flex;gap:14px;align-items:center;background:var(--color-primary-soft);color:var(--color-text);border-radius:16px;padding:12px}
.barrow{display:flex;flex-direction:column;gap:2px;align-items:center}.barrow .mono{font-size:11px;color:#fff;opacity:.9}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px;width:100%}
.icons div{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--mono)}
.icons svg{width:28px;height:28px;color:var(--color-text)}
.hdrwrap{position:relative;width:390px;flex:none;height:64px;background:var(--color-sky);border-radius:16px;overflow:hidden;zoom:.8}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}
.gcell{min-width:0}.gcell h4{margin:0 0 4px;font-size:15px;font-weight:800}.gcell p{margin:0 0 10px;font-size:13px;color:var(--muted)}
.scaler{position:relative}.phonescale{position:absolute;left:0;top:0;transform-origin:top left}
.proto{display:grid;grid-template-columns:minmax(0,420px) minmax(280px,1fr);gap:28px;align-items:start}

.mod{padding:14px 18px}.mod summary{cursor:pointer;font-size:15px}

.crumbs{display:flex;flex-wrap:wrap;gap:6px}
.crumbs button{font:700 13px var(--font);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
